"像是有什么东西抓着羊肚子上的毛，贴着石壁被慢慢拖出去过。","能想出这个法子的人，当时一定觉得自己很聪明。"]},memory:["橄榄木。尖端烧硬过。","我记得这个重量。"],vision:["洞很深，门口那块石头我们十二个人推不动。","他先吃了两个，才问我们是谁。","我说，我叫「没有人」。","我们把木桩烧红，六个人抬着，捅进去。","他喊了一夜。外面的人问他怎么了。","他喊：没有人在害我。","于是没有人来。","天亮我们贴在羊肚子下面爬出去。","船离岸了。我本来已经赢了。","我站在船尾，冲着岸上喊出了我的名字。","我要他知道是谁弄瞎了他。","……他知道了。他把这个名字，告诉了他的父亲。","海从那一天起，认识我了。"]},circe:{clue:{loom:["一架立式织机，经线还绷着。","织了很长一段，看不出要织成什么。"],mural:["地上的壁画剥了大半。","还能看出一排人，弯着腰，越往后越不像人。"],cups:["一排酒杯，摆得很齐。","每一只都空了，杯底有一圈干掉的红痕。"],vine:["藤从门外长进来，爬过柱子，又爬回门外。","一根藤长完这么一个来回，要整整一年。","它走完了一个来回。我们没有。"],roof:["屋顶边上少了几块瓦。","底下的地面凹进去一小块。"]},npcName:"喀耳刻",talk:["你又来看这架织机。","你已经看了很多次了。","一年。你们在这里待了一年。",'没有一个人问过我"我们该走了吗"。',"包括你。","……走吧。路我告诉过你了，你只是一直没有听。"],memory:["杯子还是满的。","端起来的人没有把它喝完，就再也没回来端第二次。"],vision:["我的人先进去，回来的时候趴着走。","我拔了剑，她笑了，说：把剑收起来，坐下吃饭。","于是我们坐下吃饭。","第二天也是。","第三天也是。","春天来了又过去，我没有注意。","是我的人来提醒我的。他说，我们是不是该走了。","我算了算——一年。","走的那天早上，最年轻的那个从屋顶上摔了下来。","我们急着上船，没有埋他。"]},nekyia:{clue:{marker:["一块界石，两面都磨平了。","上面没有字。这里不需要写谁在里面。"],sand:["灰白的沙，很平。","我回头看，我自己的脚印也没有。"],pyre:["一堆柴，摆得很规矩，没有点过。","柴是新的。"],pit:["一个挖好的坑，边沿很利落。","底下是干的。该倒进去的东西，谁都没有倒。"],oarMark:["沙地上插过一支桨，坑还在。","桨不见了。"]},npcName:"一个年轻的影子",talk:["你还是来了。","我从屋顶上摔下来的时候，你们已经在装船了。","我不怪你。急着走的人听不见身后的声音。","……可是你们连一捧土都没有给我。","把我的桨插在坟上。就一支桨，插在土里。","这样后来的人经过，会知道这里躺过一个划船的人。"],memory:["碗是空的，里面结着一层白。","倒进去的东西，被喝掉了。"],vision:["要跟死人说话，得先按规矩来：挖一个坑，把活人的东西倒进去。","我挖了坑，倒进蜜、奶、酒和水。","影子从四面围上来，像退潮时露出的石头。","我要找的人还没来，我得先赶开别的。","然后我看见了我母亲。","我离家的时候她还活着。","她说，是等你等死的。","我伸手去抱她。","第一次，手穿过去了。","第二次，手穿过去了。","第三次，我停下了。","她说：记住你现在看见的，回去讲给活着的人听。","这是她留给我的最后一件事——一个任务。"]},sirens:{clue:{mast:["一截立着的桅杆，齐胸的高度有一圈磨白的痕。","绳勒出来的。勒了很久。"],wax:["一坨蜡，捏过的形状还在。","正好是塞进耳朵的大小。"],wrecks:["礁上横七竖八全是船。","船头都朝着同一个方向——朝里。"],log:["一块记航板，别人的。","刻到一半停了，最后一个符号没刻完。"],bones:["石头缝里的骨头都很白，被晒过很多年。","它们排得很整齐，像坐着听什么。"]},memory:["绳子上有牙印。","是从里面咬的。"],vision:["我让他们把蜡塞进耳朵，把我绑在桅杆上。","我说：不管我怎么喊，都不许解开。","我想听。我一直都想听。","别人怕的是死在这儿。我怕的是错过——错过一件我本来可以知道的事。","歌声起来的时候，我听见的不是歌。","是有人在念我做过的每一件事，一件不落，全都念对了。","她们说：留下来，我们把你没弄明白的都讲给你听。","我用尽全身力气挣绳子。","我求他们放开我。我骂他们。我哭。","他们听不见。
