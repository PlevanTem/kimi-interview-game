phora:["一只倒了的酒瓮，口朝下。","底下的沙是干的——它倒在这里已经很久了。"],oar:["半埋的桨，只露出一截。","没有人来把它拔出来。"],footprints:["一行脚印从水边往岛里去。","只有去的那一行。","上岛的人都还在岛上。没有一个人打算回到船边。"],hearth:["一堆冷掉的火。","灰是白的，说明烧得很彻底，也说明烧完之后没人再添。"],fruit:["树上结着果子，很低，伸手就够得到。","香得让人不想再想别的。"]},npcName:"留下的人",talk:["你来了。","……我认得你，可我想不起在哪儿见的。","这里很好。风是暖的，果子是甜的。","我以前好像很急着去什么地方。","你要是想起来那是哪儿，别告诉我。"],memoryPrompt:["被丢下的头盔"],memory:["头盔翻在地上，里面积了一层沙。","带子是解开的，不是被打掉的。"],vision:["我派三个人上岸打听，这是规矩。","他们没有回来。","我去找，他们坐在树下吃东西，看见我，笑了。","他们不肯走。","不是打不过我——是他们不想走。","我把他们捆在桨座下面。","一路上他们哭着求我放开。","我没有回头。我怕我一回头，也不想走了。"]},cyclops:{clue:{pen:["石头垒的羊栏，缝里塞着羊毛。","每一块石头都太大了，不是给人搬的。"],bone:["一根肋骨，比我高。","断口是新的。"],shield:["一面青铜盾，被压成了一张饼。","中央的纹章还在，是我们的。"],char:["洞口有一堆烧焦的木头。","有一根削得很尖。"],wool:["羊毛卡在石缝里，一撮一撮，排得很整齐。","像是有什么东西抓着羊肚子上的毛，贴着石壁被慢慢拖出去过。","能想出这个法子的人，当时一定觉得自己很聪明。"]},memoryPrompt:["削尖的橄榄木桩"],memory:["橄榄木。尖端烧硬过。","我记得这个重量。"],vision:["洞很深，门口那块石头我们十二个人推不动。","他先吃了两个，才问我们是谁。","我说，我叫「没有人」。","我们把木桩烧红，六个人抬着，捅进去。","他喊了一夜。外面的人问他怎么了。","他喊：没有人在害我。","于是没有人来。","天亮我们贴在羊肚子下面爬出去。","船离岸了。我本来已经赢了。","我站在船尾，冲着岸上喊出了我的名字。","我要他知道是谁弄瞎了他。","……他知道了。他把这个名字，告诉了他的父亲。","海从那一天起，认识我了。"]},circe:{clue:{loom:["一架立式织机，经线还绷着。","织了很长一段，看不出要织成什么。"],mural:["地上的壁画剥了大半。","还能看出一排人，弯着腰，越往后越不像人。"],cups:["一排酒杯，摆得很齐。","每一只都空了，杯底有一圈干掉的红痕。"],vine:["藤从门外长进来，爬过柱子，又爬回门外。","一根藤长完这么一个来回，要整整一年。","它走完了一个来回。我们没有。"],roof:["屋顶边上少了几块瓦。","底下的地面凹进去一小块。"]},npcName:"喀耳刻",talk:["你又来看这架织机。","你已经看了很多次了。","一年。你们在这里待了一年。",'没有一个人问过我"我们该走了吗"。',"包括你。","……走吧。路我告诉过你了，你只是一直没有听。"],memoryPrompt:["没喝完的酒杯"],memory:["杯子还是满的。","端起来的人没有把它喝完，就再也没回来端第二次。"],vision:["我的人先进去，回来的时候趴着走。","我拔了剑，她笑了，说：把剑收起来，坐下吃饭。","于是我们坐下吃饭。","第二天也是。","第三天也是。","春天来了又过去，我没有注意。","是我的人来提醒我的。他说，我们是不是该走了。","我算了算——一年。","走的那天早上，最年轻的那个从屋顶上摔了下来。","我们急着上船，没有埋他。"]},nekyia:{clue:{marker:["一块界石，两面都磨平了。","上面没有字。这里不需要写谁在里面。"],sand:["灰白的沙，很平。","我回头看，我自己的脚印也没有。"],pyre:["一堆柴，摆得很规矩，没有点过。","柴是新的。"],pit:["一个挖好的坑，边沿很利落。","底下是干的。该倒进去的东西，谁都没有倒。"],oarMark:["沙地上插过一支桨，坑还在。","桨不见了。"]},npcName:"一个年轻的影子",talk:["你还是来了。","我从屋顶上摔下来的时候，你们已经在装船了。","我不怪你。急着走的人听不见身后的声音。","……可是你们连一捧土都没有给我。","把我的桨插在坟上。就一支桨，插在土里。","这样后来的人经过，会知道这里躺过一个划船的人。"],memoryPrompt:["空的祭酒碗"],memory:["碗是空的，里面结着一层白。","倒进去的东西，被喝掉了。"],vision:["要跟死人说话，得先按规矩来：挖一个坑，把活人的东西倒进去。","我挖了坑，倒进蜜、奶、酒和水。","影子从四面围上来，像退潮时露出的石头。","我要找的人还没来，我得先赶开别的。","然后我看见了我母亲。","我离家的时候她还活着。","她说，是等你等死的。","我伸手去抱她。","第一次，手穿过去了。","第二次，手穿过去了。","第三次，我停下了。","她说：记住你现在看见的，回去讲给活着的人听。","这是她留给我的最后一件事——一个任务。"]},sirens:{clue:{mast:["一截立着的桅杆，齐胸的高度有一圈磨白的痕。","绳勒出来的。勒了很久。"],wax:["一坨蜡，捏过的形状还在。","正好是塞进耳朵的大小。"],wrecks:["礁上横七竖八全是船。","船头都朝着同一个方向——朝里。"],log:["一块记航板，别人的。","刻到一半停了，最后一个符号没刻完。"],bones:["石头缝里的骨头都很白，被晒过很多年。","它们排得很整齐，像坐着听什么。"]},memoryPrompt:["带牙印的绳"],memory:["绳子上有牙印。","是从里面咬的。"],vision:["我让他们把蜡塞进耳朵，把我绑在桅杆上。","我说：不管我怎么喊，都不许解开。","我想听。我一直都想听。","别人怕的是死在这儿。我怕的是错过——错过一件我本来可以知道的事。","歌声起来的时候，我听见的不是歌。","是有人在念我做过的每一件事，一件不落，全都念对了。","她们说：留下来，我们把你没弄明白的都讲给你听。","我用尽全身力气挣绳子。","我求他们放开我。我骂他们。我哭。","他们听不见。他们只是划。","……我早就知道我会求他们。","所以我才让他们塞住耳朵。","这是我这辈子做过最聪明的一件事，也是最丢人的一件。"]},calypso:{clue:{stumps:["二十棵雪松，齐根伐掉。","数目正好够造一条船。"],hollow:["海边的岩石上有一处凹陷，正好一个人坐。","坐出这么深，要很多年。"],robe:["一件织好的衣服，挂着，没穿过。","布是不会烂的那种。"],spring:["四道泉从一处流出来，分向四边。","每一道都往岛外去，最后都进了海。"],loom:["洞口的织机上有一段没织完的布。","她织的时候一直在唱歌。我听不懂词。"]},npcName:"卡吕普索",talk:["船造好了。","我给了你斧子、钉子、布，还有风。","你要走的东西我全都给了。","我只问过你一次：留下来，我可以让你不死。","你想都没想。","……她会老。她会死。你也会。","你选了这个。","去吧。别回头看这座岛，它不会一直在这儿。"],memoryPrompt:["伐木的斧"],memory:["斧刃卷了，木柄被手心磨得发亮。","一个人砍二十棵树，要砍多少天。"],vision:["第七年。","白天我坐在这块石头上看海。","晚上我回洞里，因为除了洞里没有别的地方可去。","她说：留下来。你不会老，不会病，不会死。","她说：那个女人会老，会死，会忘了你。","她说的每一句都是真的。","我说：我知道。","可是一个不会结束的人，做什么都不算数。","我说：我还是要回去。","她没有再问第二次。","第二天她给了我斧子。"]},ithaca:{clue:{olive:["一棵橄榄树。","很多年前我用它的根做过一张床的床脚。","树还在长。床应该也还在。"],dog:["门边一堆骨头，很小的一副。","它趴着的地方正对着路口。"],cloth:["一块织了很久的布，边上拆过很多次。","拆的针脚和织的针脚一样细。"],smoke:["屋顶上有烟。","有人在里面生火做饭。"]},memoryPrompt:["门槛"],memory:["我在这块石头前面站住了。"],vision:["我以为回来的那一刻会有声音。","号角，或者哭，或者跑过来的脚步。","没有。","只有烟，和风吹过橄榄叶。","十年打仗，十年回家。","我记得每一个死在路上的人的名字。","现在我要走进去，说出我自己的。","我叫奥德修斯。","我回来了。"],epitaph:"《归航 · NOSTOS》",epitaphSub:"献给所有还在路上的人",epilogue:["十二条船出发。回来的是一个人。","","你替他把每一次失去都重新看了一遍：为了甜就不走的，为了赢多喊一句的，","为了眼前的
