说，不久。","我说这话的时候，是真的这么以为。"]},lotus:{clue:{amphora:["一只倒了的酒瓮，口朝下。","底下的沙是干的——它倒在这里已经很久了。"],oar:["半埋的桨，只露出一截。","没有人来把它拔出来。"],footprints:["一行脚印从水边往岛里去。","只有去的那一行。","上岛的人都还在岛上。没有一个人打算回到船边。"],hearth:["一堆冷掉的火。","灰是白的，说明烧得很彻底，也说明烧完之后没人再添。"],fruit:["树上结着果子，很低，伸手就够得到。","香得让人不想再想别的。"]},npcName:"留下的人",talk:["你来了。","……我认得你，可我想不起在哪儿见的。","这里很好。风是暖的，果子是甜的。","我以前好像很急着去什么地方。","你要是想起来那是哪儿，别告诉我。"],memoryPrompt:["被丢下的头盔"],memory:["头盔翻在地上，里面积了一层沙。","带子是解开的，不是被打掉的。"],vision:["我派三个人上岸打听，这是规矩。","他们没有回来。","我去找，他们坐在树下吃东西，看见我，笑了。","他们不肯走。","不是打不过我——是他们不想走。","我把他们捆在桨座下面。","一路上他们哭着求我放开。","我没有回头。我怕我一回头，也不想走了。"]},cyclops:{clue:{pen:["石头垒的羊栏，缝里塞着羊毛。","每一块石头都太大了，不是给人搬的。"],bone:["一根肋骨，比我高。","断口是新的。"],shield:["一面青铜盾，被压成了一张饼。","中央的纹章还在，是我们的。"],char:["洞口有一堆烧焦的木头。","有一根削得很尖。"],wool:["羊毛卡在石缝里，一撮一撮，排得很整齐。","像是有什么东西抓着羊肚子上的毛，贴着石壁被慢慢拖出去过。","能想出这个法子的人，当时一定觉得自己很聪明。"]},memoryPrompt:["削尖的橄榄木桩"],memory:["橄榄木。尖端烧硬过。","我记得这个重量。"],vision:["洞很深，门口那块石头我们十二个人推不动。","他先吃了两个，才问我们是谁。","我说，我叫「没有人」。","我们把木桩烧红，六个人抬着，捅进去。","他喊了一夜。外面的人问他怎么了。","他喊：没有人在害我。","于是没有人来。","天亮我们贴在羊肚子下面爬出去。","船离岸了。我本来已经赢了。","我站在船尾，冲着岸上喊出了我的名字。","我要他知道是谁弄瞎了他。","……他知道了。他把这个名字，告诉了他的父亲。","海从那一天起，认识我了。"]},circe:{clue:{loom:["一架立式织机，经线还绷着。","织了很长一段，看不出要织成什么。"],mural:["地上的壁画剥了大半。","还能看出一排人，弯着腰，越往后越不像人。"],cups:["一排酒杯，摆得很齐。","每一只都空了，杯底有一圈干掉的红痕。"],vine:["藤从门外长进来，爬过柱子，又爬回门外。","一根藤长完这么一个来回，要整整一年。","它走完了一个来回。我们没有。"],roof:["屋顶边上少了几块瓦。","底下的地面凹进去一小块。"]},npcName:"喀耳刻",talk:["你又来看这架织机。","你已经看了很多次了。","一年。你们在这里待了一年。",'没有一个人问过我"我们该走了吗"。',"包括你。","……走吧。路我告诉过你了，你只是一直没有听。"],memoryPrompt:["没喝完的酒杯"],memory:["杯子还是满的。","端起来的人没有把它喝完，就再也没回来端第二次。"],vision:["我的人先进去，回来的时候趴着走。","我拔了剑，她笑了，说：把剑收起来，坐下吃饭。","于是我们坐下吃饭。","第二天也是。","第三天也是。","春天来了又过去，我没有注意。","是我的人来提醒我的。他说，我们是不是该走了。","我算了算——一年。","走的那天早上，最年轻的那个从屋顶上摔了下来。","我们急着上船，没有埋他。"]},nekyia:{clue:{marker:["一块界石，两面都磨平了。","上面没有字。这里不需要写谁在里面。"],sand:["灰白的沙，很平。","我回头看，我自己的脚印也没有。"],pyre:["一堆柴，摆得很规矩，没有点过。","柴是新的。"],pit:["一个挖好的坑，边沿很利落。","底下是干的。该倒进去的东西，谁都没有倒。"],oarMark:["沙地上插过一支桨，坑还在。","桨不见了。"]},npcName:"一个年轻的影子",talk:["你还是来了。","我从屋顶上摔下来的时候，你们已经在装船了。","我
